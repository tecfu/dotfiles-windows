# General settings
[general]
import = [".alacritty.base.toml"]

[font]
size = 13

[font.normal]
family = "Consolas"
style = "Regular"

[font.bold]
family = "Consolas"
style = "Bold"

# Tokyo Night Color Scheme
[colors.primary]
background = "#1a1b26"
foreground = "#a9b1d6"

[colors.normal]
black   = "#32344a"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

# Keyboard bindings
# NOTE: Cannot import .alacritty.shell-bindings.toml here - Alacritty replaces
# (rather than merges) the `bindings` array on import, and PowerShell needs a
# different "clear screen" binding than the bash-based shells, so the shared
# scroll/spawn bindings are duplicated below alongside the PowerShell-specific
# Alt+K binding.
[keyboard]
bindings = [
  # Clears the screen cleanly in Windows PowerShell
  { key = "K", mods = "Alt", chars = "\u000c" }, # Sends Ctrl+L, which natively clears the PowerShell screen
  # Scrolling bindings
  { key = "J", mods = "Control|Shift", action = "ScrollLineDown" },
  { key = "K", mods = "Control|Shift", action = "ScrollLineUp" },
  { key = "J", mods = "Control", action = "ScrollPageDown", mode = "~AppCursor|~AppKeypad" },
  { key = "K", mods = "Control", action = "ScrollPageUp", mode = "~AppCursor|~AppKeypad" },
  # Alternative scrolling bindings
  { key = "Up", mods = "Control|Shift", action = "ScrollLineUp" },
  { key = "Down", mods = "Control|Shift", action = "ScrollLineDown" },
]

# Shell configuration (Defaults to PowerShell)
[terminal.shell]
program = "powershell.exe"
args = ["-NoLogo"]
