# General settings
[general]
import = [".alacritty.base.toml"]

[font]
size = 13

[font.normal]
family = "Consolas"
style = "Regular"

[font.bold]
family = "Consolas"
style = "Bold"

# Tokyo Night Color Scheme
[colors.primary]
background = "#1a1b26"
foreground = "#a9b1d6"

[colors.normal]
black   = "#32344a"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

# Keyboard bindings
# NOTE: Cannot import .alacritty.shell-bindings.toml here - Alacritty replaces
# (rather than merges) the `bindings` array on import, and PowerShell needs
# different bindings than the bash-based shells, so the shared scroll
# bindings are duplicated below.
#
# NOTE: Alt+K is intentionally NOT bound here (unlike the bash configs).
# PowerShell's PSReadLine binds Alt+k directly (see profile.ps1) to perform
# a real terminal reset; that only works if Alacritty forwards the Alt+K
# keypress through to PowerShell unmodified (as its default Alt/meta
# encoding) instead of substituting a raw Ctrl+L char here.
[keyboard]
bindings = [
  # Scrolling bindings
  { key = "J", mods = "Control|Shift", action = "ScrollLineDown" },
  { key = "K", mods = "Control|Shift", action = "ScrollLineUp" },
  { key = "J", mods = "Control", action = "ScrollPageDown", mode = "~AppCursor|~AppKeypad" },
  { key = "K", mods = "Control", action = "ScrollPageUp", mode = "~AppCursor|~AppKeypad" },
  # Alternative scrolling bindings
  { key = "Up", mods = "Control|Shift", action = "ScrollLineUp" },
  { key = "Down", mods = "Control|Shift", action = "ScrollLineDown" },
]

# Shell configuration (Defaults to PowerShell)
[terminal.shell]
program = "powershell.exe"
args = ["-NoLogo"]
