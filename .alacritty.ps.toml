# General settings
[window]
padding = { x = 10, y = 10 }
dynamic_title = true

# Shell configuration (Defaults to PowerShell)
[terminal.shell]
program = "powershell.exe"
args = ["-NoLogo"]

# Font configuration (Uses standard Windows fonts)
[font]
size = 11.0

[font.normal]
family = "Consolas"
style = "Regular"

[font.bold]
family = "Consolas"
style = "Bold"

# Tokyo Night Color Scheme
[colors.primary]
background = "#1a1b26"
foreground = "#a9b1d6"

[colors.normal]
black   = "#32344a"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"
